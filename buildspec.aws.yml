version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - set -euo pipefail
      - corepack enable
      - corepack prepare pnpm@10.12.1 --activate
  pre_build:
    commands:
      - set -euo pipefail
      - SERVICE_STACK_NAME="${SERVICE_STACK_NAME:-provenancekit-api-service-aws}"
      - SERVICE_NAME="${SERVICE_NAME:-provenancekit-api-production-aws}"
      - APP_VERSION="${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual}-${CODEBUILD_BUILD_NUMBER}"
      - IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${APP_VERSION}"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - pnpm install --frozen-lockfile
  build:
    commands:
      - pnpm --filter './packages/*' --filter '!@provenancekit/contracts' run build
      - pnpm --filter provenancekit-api run build
      - pnpm --filter @provenancekit/storage test
      - pnpm --filter provenancekit-api test
      - pnpm deploy --filter provenancekit-api --prod --legacy apps/provenancekit-api/standalone
      - cp -R apps/provenancekit-api/dist apps/provenancekit-api/standalone/dist
      - docker build --pull --platform linux/amd64 -f apps/provenancekit-api/Dockerfile -t "$IMAGE_URI" apps/provenancekit-api
      - docker push "$IMAGE_URI"
      - |
        scan_status=""
        for attempt in $(seq 1 30); do
          scan_json=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$APP_VERSION" \
            --region "$AWS_REGION" 2>/dev/null || true)
          scan_status=$(jq -r '.imageScanStatus.status // empty' <<<"$scan_json")
          if [ "$scan_status" = "COMPLETE" ]; then break; fi
          if [ "$scan_status" = "FAILED" ]; then
            jq -r '.imageScanStatus.description' <<<"$scan_json" >&2
            exit 1
          fi
          sleep 5
        done
        test "$scan_status" = "COMPLETE"
      - CRITICAL_FINDINGS=$(aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" --image-id imageTag="$APP_VERSION" --region "$AWS_REGION" --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text)
      - test "${CRITICAL_FINDINGS:-0}" = "None" || test "${CRITICAL_FINDINGS:-0}" = "0"
  post_build:
    commands:
      - set -euo pipefail
      - test "${CODEBUILD_BUILD_SUCCEEDING:-0}" = "1"
      - SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$RUNTIME_SECRET_ARN" --query SecretString --output text --region "$AWS_REGION")
      - DATABASE_SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$DATABASE_SECRET_ARN" --query SecretString --output text --region "$AWS_REGION")
      - DB_USER=$(jq -r .username <<<"$DATABASE_SECRET_JSON")
      - DB_PASSWORD=$(jq -r .password <<<"$DATABASE_SECRET_JSON")
      - DATABASE_URL=$(DB_USER="$DB_USER" DB_PASSWORD="$DB_PASSWORD" DATABASE_HOST="$DATABASE_HOST" DATABASE_PORT="$DATABASE_PORT" DATABASE_NAME="$DATABASE_NAME" node -e 'const e=encodeURIComponent; process.stdout.write(`postgresql://${e(process.env.DB_USER)}:${e(process.env.DB_PASSWORD)}@${process.env.DATABASE_HOST}:${process.env.DATABASE_PORT}/${e(process.env.DATABASE_NAME)}?sslmode=require`)')
      - |
        echo "Applying ledger-backed PostgreSQL migrations before deployment..."
        docker run --rm \
          -e DATABASE_URL="$DATABASE_URL" \
          -e VECTOR_DIMENSION=512 \
          --entrypoint /usr/bin/node \
          "$IMAGE_URI" \
          --input-type=module -e \
          'import("./dist/src/db/migrate.js").then((m) => m.runMigrations(process.env.DATABASE_URL, 512))'
      - >-
        aws cloudformation deploy
        --stack-name "$SERVICE_STACK_NAME"
        --template-file infra/aws/service.yml
        --capabilities CAPABILITY_NAMED_IAM
        --parameter-overrides
        ServiceName="$SERVICE_NAME"
        ImageUri="$IMAGE_URI"
        AppVersion="$APP_VERSION"
        RuntimeSecretArn="$RUNTIME_SECRET_ARN"
        ExecutionRoleArn="$TASK_EXECUTION_ROLE_ARN"
        TaskRoleArn="$TASK_ROLE_ARN"
        InfrastructureRoleArn="$INFRASTRUCTURE_ROLE_ARN"
        DatabaseSecretArn="$DATABASE_SECRET_ARN"
        DatabaseHost="$DATABASE_HOST"
        DatabasePort="$DATABASE_PORT"
        DatabaseName="$DATABASE_NAME"
        ObjectBucket="$OBJECT_BUCKET"
        AppSubnets="$APP_SUBNETS"
        TaskSecurityGroup="$TASK_SECURITY_GROUP"
        MinTasks="${MIN_TASKS:-2}"
        MaxTasks="${MAX_TASKS:-12}"
        --region "$AWS_REGION"
      - ENDPOINT=$(aws cloudformation describe-stacks --stack-name "$SERVICE_STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`Endpoint`].OutputValue' --output text --region "$AWS_REGION")
      - ENDPOINT="https://${ENDPOINT#https://}"
      - curl --fail --show-error --silent --retry 24 --retry-delay 10 --retry-all-errors "${ENDPOINT%/}/health" | jq -e '.status == "ok" and .storage.database == "postgresql" and .storage.files == "s3"'
      - test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${ENDPOINT%/}/v1/actions/batch")" = "401"
      - API_KEY=$(jq -r .API_KEYS <<<"$SECRET_JSON" | cut -d, -f1)
      - SMOKE_ID="aws-${CODEBUILD_BUILD_NUMBER}-$(date +%s)"
      - |
        jq -n --arg id "$SMOKE_ID" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" '{
          bundle: {
            context: "https://provenancekit.com/context/v2",
            entities: [
              {id: ("user:" + $id), role: "human", name: "AWS production smoke test"},
              {id: ("agent:" + $id), role: "ai", name: "ProvenanceKit AWS deploy verifier"}
            ],
            actions: [{
              id: ("action:" + $id), type: "transform", performedBy: ("agent:" + $id),
              timestamp: $ts, inputs: [], outputs: [{ref: ("sha256:" + $id), scheme: "hash"}]
            }],
            resources: [{
              address: {ref: ("sha256:" + $id), scheme: "hash"}, type: "text", locations: [],
              createdAt: $ts, createdBy: ("agent:" + $id), rootAction: ("action:" + $id)
            }],
            attributions: [
              {actionId: ("action:" + $id), entityId: ("agent:" + $id), role: "creator"},
              {actionId: ("action:" + $id), entityId: ("user:" + $id), role: "contributor"}
            ]
          }
        }' | curl --fail --show-error --silent \
          --header "Authorization: Bearer $API_KEY" \
          --header 'Content-Type: application/json' \
          --data-binary @- "${ENDPOINT%/}/v1/actions/batch" | \
          jq -e '.accepted.actions == 1 and .accepted.resources == 1 and (.bundleHash | startswith("sha256:"))'
      - |
        upload_result=$(printf 'aws-production-object-smoke' | curl --fail --show-error --silent \
          --header "Authorization: Bearer $API_KEY" \
          --form 'file=@-;filename=aws-smoke.txt;type=text/plain' \
          "${ENDPOINT%/}/v1/resources/upload")
        object_ref=$(jq -r .cid <<<"$upload_result")
        test "${object_ref#sha256:}" != "$object_ref"
        downloaded=$(curl --fail --show-error --silent \
          --header "Authorization: Bearer $API_KEY" \
          "${ENDPOINT%/}/v1/resources/${object_ref}/content")
        test "$downloaded" = "aws-production-object-smoke"
      - printf '{"endpoint":"%s","image":"%s","version":"%s"}\n' "$ENDPOINT" "$IMAGE_URI" "$APP_VERSION" > deployment.json

artifacts:
  files:
    - deployment.json
